[project]
name = "minimax-h3-prompt-rewriter"
version = "0.34.0"
description = "ComfyUI prompt writers for MiniMax-H3 and P-H3: local LightX2V LoRAs and GGUF writers, ordered multimodal references and RefMods, or an additional API Universal Writer for configured local and remote Chat Completions servers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
    "aiohttp>=3.13.5",
    "av>=14.0",
    "cryptography>=50.0.2",
    "transformers>=4.57.1",
    "peft>=0.17",
    "accelerate>=1.10",
    "safetensors>=0.5",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.urls]
Repository = "https://github.com/pytraveler/MiniMax-H3-Prompt-Rewriter-ComfyUI"

[tool.comfy]
PublisherId = "darkil"
DisplayName = "MiniMax-H3 Prompt Rewriter"
Icon = "https://avatars.githubusercontent.com/u/72470814"
